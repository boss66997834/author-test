<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>你是X人 · 文豪人格鉴定</title>
<style>
  @import url('https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/index.css');
  @import url('https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/700.css');
  :root{--bg:#0b0b0d;--fg:#f2efe9;--dim:#9a958c;--gold:#d4af6a;--line:#2a2a30;--soft:#17171c;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--fg);font-family:"Noto Sans SC","Source Han Sans SC","思源黑体","Microsoft YaHei",sans-serif;min-height:100vh;line-height:1.75}
  .wrap{max-width:640px;margin:0 auto;padding:28px 20px 60px}
  .center{text-align:center}
  h1{font-size:44px;letter-spacing:8px;font-weight:700;margin:18px 0 6px}
  .sub{color:var(--gold);letter-spacing:6px;font-size:15px;margin-bottom:10px}
  .hint{color:var(--dim);font-size:13px}
  .grid16{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:26px 0}
  .cell{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 2px;text-align:center;font-size:16px;letter-spacing:2px}
  .cell small{display:block;color:var(--dim);font-size:10px;letter-spacing:1px;margin-top:2px}
  .btn{display:block;width:100%;padding:15px;border:none;border-radius:10px;background:var(--gold);color:#1a1408;font-size:18px;letter-spacing:4px;font-family:inherit;cursor:pointer;margin-top:14px;font-weight:700}
  .btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold)}
  .bar{height:3px;background:var(--line);border-radius:2px;margin:18px 0 26px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
  .qnum{color:var(--dim);font-size:13px;letter-spacing:2px}
  .qt{font-size:24px;margin:18px 0 30px;line-height:1.6}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;font-size:17px;transition:all .15s;display:flex;justify-content:space-between;align-items:center}
  .opt em{font-style:normal;color:var(--dim);font-size:13px}
  .opt:active,.opt:hover{border-color:var(--gold)}
  .opt.sel{border-color:var(--gold);background:#221d10}
  .nav{display:flex;gap:10px;margin-top:22px}
  .nav button{flex:1;padding:12px;background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:10px;font-family:inherit;font-size:15px;cursor:pointer;letter-spacing:2px}
  .nav button:disabled{opacity:.3;cursor:default}
  .card{margin-top:8px}
  .ph{width:150px;height:200px;border-radius:10px;object-fit:cover;object-position:top;border:2px solid var(--gold);margin:6px auto;display:block;background:var(--soft)}
  .ph-fallback{width:150px;height:200px;border-radius:10px;border:2px solid var(--gold);margin:6px auto;display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--gold);background:var(--soft)}
  .title{font-size:40px;letter-spacing:6px;margin:14px 0 2px}
  .fullname{color:var(--dim);font-size:15px;letter-spacing:2px}
  .badges{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
  .badge{border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:3px 14px;font-size:14px;letter-spacing:2px}
  .verdict{font-size:21px;color:var(--gold);margin:24px 0 8px;letter-spacing:1px}
  .quotebox{background:var(--soft);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:16px 18px;margin:22px 0;text-align:left}
  .quotebox p{font-size:17px;line-height:1.8}
  .quotebox .src{display:block;text-align:right;color:var(--dim);font-size:13px;margin-top:8px}
  .rel{display:flex;flex-direction:column;gap:12px;margin:24px 0;text-align:left}
  .relrow{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
  .relrow b{color:var(--gold);font-size:17px;letter-spacing:1px}
  .relrow span{display:block;color:var(--dim);font-size:13.5px;margin-top:3px}
  .bar4{display:flex;gap:6px;margin:18px 0}
  .axbar{flex:1;text-align:center}
  .axbar .lbl{font-size:11px;color:var(--dim);margin-bottom:4px;letter-spacing:1px}
  .axbar .tr{height:6px;background:var(--line);border-radius:3px;position:relative;overflow:hidden}
  .axbar .tr i{position:absolute;top:0;bottom:0;background:var(--gold)}
  .cc{margin-top:52px;padding-top:18px;border-top:1px solid var(--line);color:var(--dim);font-size:12px;line-height:1.9;text-align:center}
  .cc a{color:var(--dim)}
  .sharebox{background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:14px;margin-top:16px;font-size:14px;color:var(--dim);text-align:left;word-break:break-all}
  .sharebox:empty{display:none}
  .allcards .one{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0;text-align:left}
  .allcards .one .t{font-size:22px;letter-spacing:2px}
  .allcards .one .f{color:var(--dim);font-size:13px}
  .allcards .one .v{color:var(--gold);margin:8px 0}
  .allcards .one .q{font-size:14.5px;color:#cfcabf}
  .allcards .one .q .src{color:var(--dim);font-size:12px}
  .toast{position:fixed;left:50%;bottom:12%;transform:translateX(-50%);background:var(--gold);color:#1a1408;padding:10px 22px;border-radius:999px;font-size:14px;letter-spacing:2px;opacity:0;transition:opacity .3s;pointer-events:none;font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}
  .toast.show{opacity:1}
  .allhead{display:flex;align-items:center;gap:14px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0;text-align:left}
  .allhead img,.allhead .phv{width:60px;height:78px;border-radius:8px;object-fit:cover;object-position:top;border:1px solid var(--gold);flex:0 0 auto;background:var(--soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:24px}
  .allhead .t{font-size:22px;letter-spacing:2px}
  .allhead .f{color:var(--dim);font-size:13px}
  .hidden{display:none}
  @media (max-width:420px){
    h1{font-size:34px;letter-spacing:5px}
    .title{font-size:32px;letter-spacing:4px}
    .qt{font-size:20px;margin:14px 0 24px}
    .wrap{padding:20px 14px 50px}
    .opt{font-size:16px;padding:13px 14px}
    .opt em{font-size:12px}
    .verdict{font-size:18px}
    .quotebox p{font-size:15.5px}
    .quotebox{padding:14px 15px}
    .btn{font-size:17px;padding:14px;letter-spacing:3px}
    .ph,.ph-fallback{width:120px;height:160px}
    .ph-fallback{font-size:36px}
    .relrow b{font-size:16px}
    .relrow span{font-size:13px}
    .allcards .one .t{font-size:20px}
    .allcards .one .q{font-size:13.5px}
  }
</style>
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js"></script>
</head>
<body>
<div class="wrap">

  <!-- 开始页 -->
  <section id="p-start" class="center">
    <div class="sub">文 豪 人 格 鉴 定</div>
    <h1>你是X人</h1>
    <p class="hint">十六位小说家 · 四条底色 · 24 题<br>测出你是哪位文豪转世</p>
    <p class="hint" style="margin-top:20px">孤独 ↔ 热闹｜思辨 ↔ 乱飞<br>毒舌 ↔ 心软｜苦役 ↔ 放浪</p>
    <p class="hint" style="margin:16px 0 0;color:#6f6a61">卡人？陀人？余人？宰人？<br>——答案在最后</p>
    <button class="btn" onclick="startQuiz()">开 始 鉴 定</button>
  </section>

  <!-- 答题页 -->
  <section id="p-quiz" class="hidden">
    <div class="bar"><i id="prog"></i></div>
    <div class="qnum" id="qnum"></div>
    <div class="qt" id="qt"></div>
    <div class="opts" id="opts"></div>
    <div class="nav">
      <button id="btnPrev" onclick="prevQ()">← 上一题</button>
      <button id="btnNext" onclick="nextQ()" disabled>下一题 →</button>
    </div>
  </section>

  <!-- 结果页 -->
  <section id="p-result" class="center card hidden"></section>

  <!-- 全览页 -->
  <section id="p-all" class="allcards hidden">
    <h2 class="center" style="letter-spacing:4px;margin-bottom:6px">十六文豪全览</h2>
    <p class="hint center" style="margin-bottom:16px">按孤独组 / 热闹组分列</p>
    <div id="allList"></div>
    <button class="btn" onclick="backHome()">回 去 测 一 下</button>
  </section>

  <footer class="cc">

</div>

const AXES=_D.AXES, QS=_D.QS, OPTLBL=_D.OPTLBL, R=_D.R, ORDER_LONELY=_D.OL, ORDER_LOUD=_D.OD, MAP=_D.MAP;
const HIDDEN=_D.h; R[HIDDEN.key]=HIDDEN.card;
const SITE_URL = location.href.split("#")[0];
/* ============ 状态 ============ */
let qi = 0, answers = new Array(QS.length).fill(null), t0 = 0, QSEQ = [];

function show(id){
  ["p-start","p-quiz","p-result","p-all"].forEach(p=>document.getElementById(p).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  window.scrollTo(0,0);
}
function startQuiz(){
  qi=0; answers=new Array(QS.length).fill(null); t0=Date.now();
  QSEQ = QS.map((_,i)=>i);
  for(let i=QSEQ.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [QSEQ[i],QSEQ[j]]=[QSEQ[j],QSEQ[i]]; }
  show("p-quiz"); renderQ();
}
function backHome(){ show("p-start"); }
function showAll(){
  const box = document.getElementById("allList");
  box.innerHTML = "";
  [["孤独组",ORDER_LONELY],["热闹组",ORDER_LOUD]].forEach(([grp,arr])=>{
    const h = document.createElement("p");
    h.className = "hint center"; h.style.letterSpacing="6px"; h.textContent = "— "+grp+" —";
    box.appendChild(h);
    arr.forEach(k=>{
      const o = R[k];
      const d = document.createElement("div");
      d.className = "allhead";
      d.innerHTML = `<img src="${o.photo}" onerror="this.outerHTML='<div class=&quot;phv&quot;>${k[0]}</div>'"><div><div class="t">${k}</div><div class="f">${o.full} ｜ ${o.tag}</div></div><div style="margin-left:auto;text-align:right;color:var(--gold);font-size:15px;flex:0 0 auto">「${o.verdict}」<div class="f" style="color:var(--dim);font-size:12px;margin-top:4px">${o.src}</div></div>`;
      box.appendChild(d);
    });
  });
  const ho=HIDDEN.card, hk=HIDDEN.key;
  const hid=document.createElement("div");
  hid.className="allhead";
  hid.innerHTML=`<img src="${ho.photo}" onerror="this.outerHTML='<div class=&quot;phv&quot;>${hk[0]}</div>'"><div><div class="t">${hk} ${HIDDEN.emo}</div><div class="f">${ho.full} ｜ ${ho.tag}</div></div><div style="margin-left:auto;text-align:right;color:var(--gold);font-size:15px;flex:0 0 auto">「${HIDDEN.allBadge}」<div class="f" style="color:var(--dim);font-size:12px;margin-top:4px">${HIDDEN.allTag}</div></div>`;
  box.appendChild(hid);
  show("p-all");
}

function renderQ(){
  const q = QS[QSEQ[qi]];
  document.getElementById("prog").style.width = (qi/(QS.length-1)*100)+"%";
  document.getElementById("qnum").textContent = `第 ${qi+1} / ${QS.length} 题`;
  document.getElementById("qt").textContent = q.t;
  const box = document.getElementById("opts");
  box.innerHTML = "";
  OPTLBL.forEach(([v,lbl])=>{
    const b = document.createElement("div");
    b.className = "opt" + (answers[qi]===Number(v) ? " sel" : "");
    b.innerHTML = `<span>${lbl}</span><em>${v}</em>`;
    b.onclick = ()=>{
      answers[qi]=Number(v);
      renderQ();
      if(qi===QS.length-1 && answers[qi]!==null){ setTimeout(finish, 550); }
    };
    box.appendChild(b);
  });
  document.getElementById("btnPrev").disabled = qi===0;
  const nb = document.getElementById("btnNext");
  nb.disabled = false;
  nb.textContent = (answers[qi]===null ? "（选一个答案解锁）" : "") + (qi===QS.length-1 ? "查看结果 ✦" : "下一题 →");
}
function prevQ(){ if(qi>0){qi--;renderQ();} }
function nextQ(){
  if(answers[qi]===null){
    const t=document.getElementById("toast"); t.textContent="先选一个答案哦"; t.classList.add("show");
    setTimeout(()=>{t.classList.remove("show"); t.textContent="已复制";},1500);
    return;
  }
  if(qi<QS.length-1){ qi++; renderQ(); }
  else finish();
}

/* ============ 计分 ============ */
function finish(){
 try{
  if((Date.now()-t0) < 5000){ renderHidden('fast'); return; }
  if(answers.length===QS.length && answers.every(v=>v===answers[0])){ renderHidden('same'); return; }
  const score = {}; Object.keys(AXES).forEach(k=>score[k]=0);
  QSEQ.forEach((ri,di)=>{
    const q = QS[ri], v = answers[di];
    if(!v) return;
    if(v>0){ score[q.a]+=v; score[q.b]+=v; }
    else { score[AXES[q.a]]+=-v; score[AXES[q.b]]+=-v; }
  });
  const pick = (a,b)=> score[a]===score[b] ? a : (score[a]>score[b]?a:b);
  const combo = [pick("孤独","热闹"), pick("思辨","乱飞"), pick("毒舌","心软"), pick("苦役","放浪")];
  const name = MAP[combo.join("|")];
  const key = R[name];

  const pct = (a,b)=>{ const s=score[a]+score[b]; return s? Math.round(score[a]/s*100):50; };
  const bars = [
    ["孤独",pct("孤独","热闹"),"热闹"],["思辨",pct("思辨","乱飞"),"乱飞"],
    ["毒舌",pct("毒舌","心软"),"心软"],["苦役",pct("苦役","放浪"),"放浪"]
  ].map(([l,p,r])=>`<div class="axbar"><div class="lbl">${l} ${p}%</div><div class="tr"><i style="width:${p}%"></i></div><div class="lbl">${r} ${100-p}%</div></div>`).join("");

  const el = document.getElementById("p-result");
  el.innerHTML = `
    <div class="sub">你 是</div>
    <h1 class="title">${name}</h1>
    <div class="fullname">${key.full}</div>
    <img class="ph" src="${key.photo}" onerror="this.outerHTML='<div class=&quot;ph-fallback&quot;>${name[0]}</div>'">
    <div class="badges">${key.tag.split("·").map(x=>`<span class="badge">${x}</span>`).join("")}</div>
    <div class="verdict">「${key.verdict}」</div>
    <div class="quotebox"><p>“${key.quote}”<span class="src">——${key.src}</span></p></div>
    <div class="rel">
      <div class="relrow"><b>最懂你的：${key.best[0]}</b><span>（${key.best[1]}）</span></div>
      <div class="relrow"><b>最让你沉默的：${key.worst[0]}</b><span>（${key.worst[1]}）</span></div>
    </div>
    <div class="bar4">${bars}</div>
    <button class="btn" onclick="genShare('${name}')">生 成 分 享 海 报</button>
    <button class="btn ghost" onclick="showAll()">看 看 其 他 十 五 人</button>
    <button class="btn ghost" onclick="startQuiz()">再 测 一 次</button>
    <div class="sharebox" id="sharebox"></div>
    <div id="posterbox"></div>
  `;
  show("p-result");
 }catch(e){
  const el=document.getElementById("p-result");
  el.innerHTML='<div class="sub">出 错 了</div><p class="hint">'+((e&&e.message)?e.message:e)+'</p><button class="btn ghost" onclick="startQuiz()">重 新 开 始</button>';
  show("p-result");
 }
}

function shareURL(name){
  const base = location.origin && location.origin!=='null' ? location.origin+location.pathname : location.href.split('#')[0].split('?')[0];
  let url = base+'?from='+encodeURIComponent(name);
  if(PARENT){ try{ url += '&t=' + encodeURIComponent(btoa(unescape(encodeURIComponent(PARENT.split('>').slice(0,2).join('>'))))); }catch(e){} }
  return url;
}

  const v = answers[0];
  const lead = mode==='fast' ? HIDDEN.fastLead : (HIDDEN.leads[String(v)] || HIDDEN.leadDef);
  const name=HIDDEN.key; const key=R[name];

    <div class="rel">

    <div class="sharebox" id="sharebox"></div>
    <div id="posterbox"></div>
  `;

}

function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toastOk()).catch(()=>fallbackCopy(txt));
  } else fallbackCopy(txt);
}
function makeQR(url, cb){
  if(typeof QRCode==='undefined'){ cb(null); return; }
  try{
    const holder=document.createElement('div');
    new QRCode(holder,{text:url,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
    const c=holder.querySelector('canvas');
    if(c && c.toDataURL){ cb(c.toDataURL()); return; }
    const im=holder.querySelector('img');
    if(im && im.src){ cb(im.src); return; }
    cb(null);
  }catch(e){ cb(null); }
}
function wrapText(g,text,x,y,maxW,lh,maxLines){
  let line='',lines=[];
  for(const ch of text){
    if(g.measureText(line+ch).width>maxW){ lines.push(line); line=ch; } else line+=ch;
  }
  lines.push(line);
  lines.slice(0,maxLines).forEach((l,i)=>g.fillText(l,x,y+i*lh));
  return y+Math.min(lines.length,maxLines)*lh;
}
function genShare(name){
  const o = R[name];
  const url = shareURL(name);
  const txt = `我测出来是【${name}·${o.full.split(" ")[0]}】：${o.verdict}\n底色：${o.tag}\n—— 你是X人 · 文豪人格鉴定（24题版）\n${url}`;
  const box = document.getElementById("sharebox");
  box.textContent = txt;
  copyText(txt);
  makeQR(url, qr=>{
    const img = new Image();
    img.onload = ()=>drawPoster(name,o,url,img,qr);
    img.onerror = ()=>drawPoster(name,o,url,null,qr);
    img.src = o.photo;
  });
}
function countLines(g,text,maxW){
  let line='',n=1;
  for(const ch of text){ if(g.measureText(line+ch).width>maxW){n++;line=ch;} else line+=ch; }
  return n;
}
function drawPoster(name,o,url,img,qr){
  const box = document.getElementById("posterbox");
  try{
    const probe = document.createElement('canvas').getContext('2d');
    probe.font='700 34px "Noto Sans SC",sans-serif';
    const vLines=Math.min(2,countLines(probe,'「'+o.verdict+'」',640));
    probe.font='27px "Noto Sans SC",sans-serif';
    const qLines=Math.min(4,countLines(probe,'“'+o.quote+'”',600));
    const PH_TOP=310, PH=390;
    const yAfterPhoto=PH_TOP+PH+52;
    const yV=yAfterPhoto+34+ (vLines-1)*48;
    const yQ1=yV+42;
    const ySrc=yQ1+(qLines-1)*42+40;
    const yTag=ySrc+46;
    const yQR=yTag+46;
    const yEnd=yQR+216+56;
    const H=yEnd+26;

    const cv=document.createElement('canvas'); cv.width=750; cv.height=Math.max(H,1240);
    const g=cv.getContext('2d');
    g.fillStyle='#0b0b0d'; g.fillRect(0,0,750,cv.height);
    g.strokeStyle='#d4af6a'; g.lineWidth=3; g.strokeRect(26,26,698,cv.height-52);
    g.textAlign='center';
    g.fillStyle='#d4af6a'; g.font='700 30px "Noto Sans SC",sans-serif';
    g.fillText('你 是 X 人 · 文 豪 人 格 鉴 定', 375, 108);
    g.fillStyle='#f2efe9'; g.font='700 96px "Noto Sans SC",sans-serif';
    g.fillText(name, 375, 232);
    g.fillStyle='#c9c4b8'; g.font='25px "Noto Sans SC",sans-serif';
    g.fillText(o.full, 375, 278);
    if(img){
      const PW=300,PX=375-PW/2,PY=PH_TOP,RR=14;
      g.save(); g.beginPath(); rrPath(g,PX,PY,PW,PH,RR); g.clip();
      const scale=Math.max(PW/img.width,PH/img.height);
      const dw=img.width*scale, dh=img.height*scale;
      g.drawImage(img,375-dw/2,PY+PH/2-dh/2,dw,dh);
      g.restore();
      g.strokeStyle='#d4af6a'; g.lineWidth=4; g.beginPath();
      rrPath(g,PX-4,PY-4,PW+8,PH+8,RR+3); g.stroke();
    }
    g.fillStyle='#d4af6a'; g.font='700 34px "Noto Sans SC",sans-serif';
    wrapText(g,'「'+o.verdict+'」',375,yAfterPhoto,640,48,vLines);
    g.fillStyle='#cfcabf'; g.font='27px "Noto Sans SC",sans-serif';
    wrapText(g,'“'+o.quote+'”',375,yQ1,600,42,qLines);
    g.fillStyle='#9a958c'; g.font='23px "Noto Sans SC",sans-serif';
    g.fillText('——'+o.src, 375, ySrc);
    g.fillStyle='#c9c4b8'; g.font='23px "Noto Sans SC",sans-serif';
    g.fillText('底色：'+o.tag, 375, yTag);
    if(qr){
      const qi=new Image();
      qi.onload=()=>{
        g.fillStyle='#ffffff';
        g.beginPath(); rrPath(g,375-108,yQR,216,216,16); g.fill();
        g.drawImage(qi,375-94,yQR+14,188,188);
        g.fillStyle='#d4af6a'; g.font='24px "Noto Sans SC",sans-serif';
        g.fillText('扫码测测你是哪位文豪', 375, yEnd-6);
        outputPoster(cv,name,box);
      };
      qi.onerror=()=>{ drawQRfallback(g,url,yQR); outputPoster(cv,name,box); };
      qi.src=qr;
    } else { drawQRfallback(g,url,yQR); outputPoster(cv,name,box); }
  }catch(e){
    box.innerHTML='<p class="hint">海报生成失败（本地文件模式限制），文案已复制——线上版支持海报。</p>';
  }
}
function rrPath(g,x,y,w,h,r){g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function drawQRfallback(g,url,y0){
  g.fillStyle='#d4af6a'; g.font='22px "Noto Sans SC",sans-serif';
  g.fillText('测测你是哪位文豪：', 375, y0+60);
  g.fillStyle='#9a958c'; g.font='18px "Noto Sans SC",sans-serif';
  wrapText(g,url,375,y0+95,600,26,3);
}
function outputPoster(cv,name,box){
  const out=cv.toDataURL('image/png');
  box.innerHTML='';
  const pic=document.createElement('img');
  pic.src=out; pic.style.cssText='width:100%;border-radius:12px;border:1px solid #2a2a30;margin-top:14px';
  const a=document.createElement('a');
  a.href=out; a.download=name+'-你是X人.png'; a.textContent='下 载 海 报（或长按保存）';
  a.className='btn ghost'; a.style.textAlign='center'; a.style.textDecoration='none';
  box.appendChild(pic); box.appendChild(a);
}
function toastOk(){
  const t = document.getElementById("toast");
  t.textContent='已复制'; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1600);
}

if(location.hash==="#all") window.addEventListener("load",()=>showAll());

/* ---- from 来源统计（纯前端：localStorage 聚合，会话去重） ---- */
const FROM = (function(){ try{ return new URLSearchParams(location.search).get('from'); }catch(e){ return null; } })();
const PARENT = (function(){ try{ const t=new URLSearchParams(location.search).get('t'); return t ? decodeURIComponent(escape(atob(t))) : ''; }catch(e){ return ''; } })();
const CHAIN = FROM ? (PARENT ? FROM+'>'+PARENT : FROM) : '';
const CHANNEL = (function(){
  try{
    const ch = new URLSearchParams(location.search).get('ch') || '';
    const map = {xhs:'小红书', pyq:'朋友圈码', wx:'微信群码', wb:'微博', dy:'抖音', other:'其他渠道'};
    if(ch && map[ch]) return map[ch];
    if(ch) return '渠道:'+ch;
    const u = navigator.userAgent || '';
    if(/MicroMessenger/i.test(u)) return '微信内';
    if(/XiaoHongCheng|xhs/i.test(u)) return '小红书';
    if(/QQ\//i.test(u) || /TIM/i.test(u)) return 'QQ';
    if(/WeiBo/i.test(u)) return '微博';
    if(/Mobile|Android|iPhone/i.test(u)) return '扫码直开';
    return '电脑';
  }catch(e){ return '未知'; }
})();
if(CHAIN){
  try{
    if(!sessionStorage.getItem('xren_seen')){
      sessionStorage.setItem('xren_seen','1');
      const kd='xren_from_direct', kc='xren_from_chain';
      const cd=JSON.parse(localStorage.getItem(kd)||'{}');
      cd[FROM]=(cd[FROM]||0)+1;
      localStorage.setItem(kd,JSON.stringify(cd));
      const cc=JSON.parse(localStorage.getItem(kc)||'{}');
      cc[CHAIN]=(cc[CHAIN]||0)+1;
      localStorage.setItem(kc,JSON.stringify(cc));
    }
  }catch(e){}
}

try{ new Image().src = '/api/track?from=' + encodeURIComponent(CHANNEL + '>' + (CHAIN || '直访')); }catch(e){}
